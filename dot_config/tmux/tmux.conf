# use 24-bit true color (if terminal emulator supports)
set-option -sa terminal-overrides ",xterm*:Tc"

# mouse off -- fully keyboard-driven (casual scroll falls through to the terminal;
# use prefix + [ for copy-mode scroll/selection)
set -g mouse off

# start window/pane numbering at 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# set prefix to ctrl-space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# prefix-r to reload config
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "reloaded tmux config $XDG_CONFIG_HOME/tmux/tmux.conf"

# split pane with | and =, and keep current path
bind | split-window -h -c "${pane_current_path}"
bind - split-window -v -c "${pane_current_path}"

# vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# Status bar at top of screen
set -g status-position top

# Status bar colors
set -g status-style 'bg=#{?client_prefix,#2E4737,#13161d} fg=#8b949e'
set -g status-left-length 20
set -g status-right-length 50

# Status bar content
set -g status-left '#[fg=#00A362,bold]  #S #[fg=#30363d]│ '
set -g status-interval 60
set -g status-right '#[fg=#8b949e]#{pane_current_command} #[fg=#30363d]│#[fg=#8b949e] #(TZ=UTC date +%%HZ)~%H:%M #[fg=#30363d]│#[fg=#8b949e] %Y-%m-%d '

# Window status
setw -g window-status-format ' #I:#W#{?window_zoomed_flag,,} '
setw -g window-status-current-format '#[fg=#00A362,bold] #I:#W#{?window_zoomed_flag,,} '



# --- copy mode (vi) ---
setw -g mode-keys vi
# let tmux push copies to the outer terminal via OSC 52 (works over SSH too)
set -g set-clipboard on

# scroll 10 lines at a time with J/K
bind -T copy-mode-vi J send-keys -X -N 10 scroll-down
bind -T copy-mode-vi K send-keys -X -N 10 scroll-up

# vim-style selection + yank to Windows clipboard (win32yank) AND tmux buffer
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "win32yank.exe -i --crlf"

# paste tmux buffer inside a pane: prefix + ]
bind ] paste-buffer -p

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Extrakto: prefix + u (or Tab) -> fuzzy-grab URLs/paths/tokens from the pane
#   Enter=insert into pane  |  Tab=copy to clipboard  |  Ctrl-o=open (URLs)
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'u'
set -g @extrakto_clip_tool 'win32yank.exe -i --crlf'
set -g @extrakto_open_tool 'wslview'
# Ctrl-f cycles these modes (first = default on open): urls -> paths -> words -> whole lines -> all
set -g @extrakto_filter_order 'url path word line all'
# start narrow; Ctrl-g cycles: recent -> window recent -> full -> window full
# (single-pane windows auto-skip the redundant "window" steps)
set -g @extrakto_grab_area 'recent'
# keep the familiar prefix+Tab as a second trigger alongside @extrakto_key
bind Tab run-shell "$XDG_CONFIG_HOME/tmux/plugins/extrakto/scripts/open.sh \"#{pane_id}\""

# Resurrect: save/restore sessions across restarts
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

run '~/.tmux/plugins/tpm/tpm'
